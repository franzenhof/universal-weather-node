openapi: 3.1.0
info:
  title: Universal Weather Node HTTP API
  version: "1"
  summary: Local HTTP API of the Universal Weather Node (ESP32-S3 weather station firmware).
  description: |
    The node serves its measurements as JSON on port 80 of its Wi-Fi address
    (also `http://<hostname>.local/`, see `/api/info` and docs/api.md).
    The project deliberately has no big display — build your own UI against
    the read-only endpoints `/api/info`, `/api/data` and `/api/history`.

    * **Read-only endpoints** need no authentication and send
      `Access-Control-Allow-Origin: *`, so a page from any origin may read
      them (CORS). They never contain secrets.
    * **Settings and log** (`/api/settings`, `/api/log*`) use HTTP Digest
      authentication (user `admin`, the admin password set in the config
      portal; without a password they answer 403). They send no CORS headers
      and refuse cross-site POSTs (Origin/Referer must match Host).
    * Plain HTTP only — keep the node inside your LAN.

    **Contract and versioning:** every JSON document carries `apiVersion`
    (currently `1`). Within one apiVersion fields are only *added*; renaming,
    removing or changing the type/unit/meaning of a field requires
    apiVersion 2. Ignore fields you don't know. A field that is absent means
    "not available" — never assume 0.

    Developer guide: docs/api.md. Example responses: docs/api/examples/.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
externalDocs:
  description: Developer guide (docs/api.md)
  url: https://github.com/franzenhof/universal-weather-node/blob/main/docs/api.md
servers:
  - url: http://{host}
    description: A Universal Weather Node in your LAN
    variables:
      host:
        default: weathernode.local
        description: IP address or mDNS name (<hostname>.local, see /api/info device.hostname)
  - url: http://localhost:8080
    description: Mock server (tools/api-mock/mock_server.py)

tags:
  - name: data
    description: Read-only JSON for UIs and integrations (no auth, CORS *)
  - name: pages
    description: The node's own HTML pages
  - name: admin
    description: Settings and log (Digest auth, same-origin)

paths:
  /api/info:
    get:
      tags: [data]
      operationId: getInfo
      summary: Device description
      description: |
        Name, mDNS host name, firmware, board, units, enabled outputs, which
        value groups `/api/data` carries, value sources, cycle length and
        history ranges. Read it at start-up and again when
        `device.uptimeSec` went down (the node restarted).
      responses:
        "200":
          description: Device description.
          headers:
            Access-Control-Allow-Origin: { $ref: "#/components/headers/AllowOrigin" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "./schemas/info.schema.json" }
              examples:
                pcb-v2-full: { externalValue: "./examples/pcb-v2-full/info.json" }
                bresser: { externalValue: "./examples/bresser-7in1-bme280/info.json" }
        "500": { $ref: "#/components/responses/AllocationFailed" }
    options:
      tags: [data]
      operationId: preflightInfo
      summary: CORS preflight
      responses:
        "204": { $ref: "#/components/responses/Preflight" }

  /metrics:
    get:
      tags: [data]
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        The same public data as `/api/data`, in Prometheus text exposition
        format and fixed SI base units (Celsius, m/s, hPa, mm, lux, seconds,
        bytes), regardless of the configured display units: the selected
        weather values, every wireless sensor (labels `sensor` = the custom ID of a
        ★ sensor, else `rf<radio ID>`; `radio_id`, `model`, `name`, `channel`)
        and system values (uptime, heap, Wi-Fi RSSI). A wireless
        sensor that has gone silent keeps `uwn_rf_up 0`, `uwn_rf_age_seconds`,
        RSSI and packet count, but no measured values. Rain totals are running
        totals: `uwn_rain_total_mm` = the selected rain source since the start
        (0 after a rain reset), `uwn_rf_rain_total_mm` = the sensor's own
        counter (0 after a battery change) - use `increase()`. No login —
        scrape it with Prometheus, VictoriaMetrics, Grafana Alloy or Telegraf.
      responses:
        "200":
          description: Metrics in Prometheus text format (version=0.0.4).
          headers:
            Access-Control-Allow-Origin: { $ref: "#/components/headers/AllowOrigin" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            text/plain:
              schema: { type: string }
    options:
      tags: [data]
      operationId: preflightMetrics
      summary: CORS preflight
      responses:
        "204": { $ref: "#/components/responses/Preflight" }

  /api/events:
    get:
      tags: [data]
      operationId: getEvents
      summary: Live values as Server-Sent Events
      description: |
        A `text/event-stream` that sends the `/api/data` JSON as one `data:`
        line whenever something changed (a received wireless packet or the end
        of a measurement cycle), at most every 2 s, and an `event: ping` (data `1`)
        after 20 s without data. Use it with `EventSource`; the stream starts
        with `retry: 5000` (reconnect after 5 s). No login. At most 3
        subscribers at a time; another one gets 503 with `Retry-After`. A
        subscriber that can't take an event at once is disconnected.
      responses:
        "200":
          description: Event stream.
          headers:
            Access-Control-Allow-Origin: { $ref: "#/components/headers/AllowOrigin" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            text/event-stream:
              schema: { type: string }
        "503":
          description: Too many subscribers; retry later.
          content:
            text/plain:
              schema: { type: string }
    options:
      tags: [data]
      operationId: preflightEvents
      summary: CORS preflight
      responses:
        "204": { $ref: "#/components/responses/Preflight" }

  /api/records:
    get:
      tags: [data]
      operationId: getRecords
      summary: Records (extremes) of today, yesterday, month, year, all time
      description: |
        Minimum / maximum with time of temperature, humidity, pressure (QNH),
        and maximum gust and rain rate, plus the largest daily rain - per
        period, in the configured units. Periods roll over at local midnight;
        `valid` is false before the first clock sync. Today's min/max
        temperature and max gust are also in `/api/data` (`tempMinToday`, …).
      responses:
        "200":
          description: Records.
          headers:
            Access-Control-Allow-Origin: { $ref: "#/components/headers/AllowOrigin" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "./schemas/records.schema.json" }
              examples:
                bresser: { externalValue: "./examples/bresser-7in1-bme280/records.json" }
        "500": { $ref: "#/components/responses/AllocationFailed" }
    options:
      tags: [data]
      operationId: preflightRecords
      summary: CORS preflight
      responses:
        "204": { $ref: "#/components/responses/Preflight" }

  /api/time:
    post:
      tags: [pages]
      operationId: postTime
      summary: The browser's time for a node without internet
      description: |
        The dashboard sends the device's clock once per page load (form field
        `ms` = Unix time in milliseconds). The node takes it as the time
        source `phone` (`/api/info` measurement.clockSource) when the request
        came over its own access point, or when it has no fresh time at all;
        a fresh better source (GNSS, NTP, DCF77 sensor) still wins. No login
        (docs/airfield.md). `result`: `set` (clock stepped), `confirmed`
        (within 2 s), `blocked` (a better source is fresh), `refused` (station
        LAN while the node has a fresh time), `invalid` (not a time between
        2024 and 2099, answered with 400).
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [ms]
              properties:
                ms: { type: string, pattern: "^[0-9]+$" }
      responses:
        "200":
          description: What the node did with it, and the source its clock follows now.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string, enum: [set, confirmed, blocked, refused] }
                  clockSource: { type: string, enum: [none, gnss, ntp, dcf77, phone, lorawan] }
        "400":
          description: No valid time.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string, enum: [invalid] }
                  clockSource: { type: string }

  /api/alarms:
    get:
      tags: [data]
      operationId: getAlarms
      summary: Alarm rules and their state
      description: |
        The defined alarm rules with thresholds (configured units), channels,
        and whether each is raised now. No addresses, tokens or keys.
      responses:
        "200":
          description: Alarm rules.
          headers:
            Access-Control-Allow-Origin: { $ref: "#/components/headers/AllowOrigin" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "./schemas/alarms.schema.json" }
              examples:
                bresser: { externalValue: "./examples/bresser-7in1-bme280/alarms.json" }
        "500": { $ref: "#/components/responses/AllocationFailed" }
    options:
      tags: [data]
      operationId: preflightAlarms
      summary: CORS preflight
      responses:
        "204": { $ref: "#/components/responses/Preflight" }

  /api/data:
    get:
      tags: [data]
      operationId: getData
      summary: Current measurement
      description: |
        Values of the last completed measurement cycle — the same JSON the
        node publishes on the MQTT topic `<prefix>/data` (MQTT may use a
        different wind window, see `/api/info` measurement.mqttWindAggregation).
        Each `rfSensors[]` item (up to 32 wireless sensors) is also published
        on its own MQTT topic `<prefix>/rf/<custom ID>` (★ sensors: the custom ID,
        `customId`; others: `rf` + the radio ID `id`) - the object plus `radioId`,
        same schema `#/$defs/rfSensor` in data.schema.json. Fine Offset air
        quality, leak, leaf wetness, soil EC and indoor sensors add
        per-sensor values there (`pm25`, `co2Ppm`, `leak`, `pressure`, …).
        Does not trigger a measurement. New values exist every
        `measurement.cycleSec`; poll again `nextCycleInSec` + 2 s later.
        The response is sent with chunked transfer encoding.
      responses:
        "200":
          description: Current values. Fields appear only while their sensor/function delivers.
          headers:
            Access-Control-Allow-Origin: { $ref: "#/components/headers/AllowOrigin" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "./schemas/data.schema.json" }
              examples:
                bresser-7in1-bme280: { externalValue: "./examples/bresser-7in1-bme280/data.json" }
                ecowitt: { externalValue: "./examples/ecowitt-ws90-wh31-wh51-wh57/data.json" }
                pcb-v2-full: { externalValue: "./examples/pcb-v2-full/data.json" }
                pcb-v2-imperial: { externalValue: "./examples/pcb-v2-imperial/data.json" }
                heltec-v4-wireless: { externalValue: "./examples/heltec-v4-wireless/data.json" }
        "500": { $ref: "#/components/responses/AllocationFailed" }
    options:
      tags: [data]
      operationId: preflightData
      summary: CORS preflight
      responses:
        "204": { $ref: "#/components/responses/Preflight" }

  /api/history:
    get:
      tags: [data]
      operationId: getHistory
      summary: Bucketed history (24 h of 5-min, 35 days of hourly, 2 years of daily values)
      description: |
        Parallel arrays, oldest first; `ageSec[i]` is the age of point i's end
        at the time of the response, the last element (ageSec 0, only at
        end = now) is the still-open bucket. `null` = no data in that bucket.
        Temperature, humidity and pressure also carry the lowest / highest
        cycle value per point (`tempMin` / `tempMax`, `humMin` / `humMax`,
        `pressMin` / `pressMax`, in the units of their means).
        Ranges with more than 400 buckets are downsampled on the node
        (`bucketSec` in the response). Period compare: request the same
        range twice, once with `end` = now − range (e.g. `range=7d` and
        `range=7d&end=<now − 7 days>`), and the same `res` for both.
      parameters:
        - name: range
          in: query
          required: false
          description: |
            Window length. `24h` (default): 5-min buckets, up to 288.
            `7d`: hourly buckets, up to 168. `30d`: hourly buckets merged
            into 2-h points, up to 360. `1y`: local days, up to 365.
            Any other value is treated as `24h`.
          schema:
            type: string
            enum: ["24h", "7d", "30d", "1y"]
            default: "24h"
        - name: end
          in: query
          required: false
          description: |
            End of the window, unix seconds (default and any later value:
            now). Points whose bucket ends in (end − range, end]. Ignored
            while the node's clock is not synced. Without `res`, the finest
            tier that reaches back to end − range serves it (5 min: 24 h,
            hourly: 35 days, daily: 2 years - /api/info `history.tiers`).
          schema: { type: integer, minimum: 1 }
        - name: res
          in: query
          required: false
          description: |
            Force the tier: `5m`, `1h` or `1d` (e.g. the same resolution for
            both halves of a compare). Buckets older than the tier keeps are
            simply absent.
          schema:
            type: string
            enum: ["5m", "1h", "1d"]
      responses:
        "200":
          description: History of the requested range.
          headers:
            Access-Control-Allow-Origin: { $ref: "#/components/headers/AllowOrigin" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "./schemas/history.schema.json" }
              examples:
                24h: { externalValue: "./examples/pcb-v2-full/history-24h.json" }
                7d: { externalValue: "./examples/pcb-v2-full/history-7d.json" }
                30d: { externalValue: "./examples/pcb-v2-full/history-30d.json" }
                1y: { externalValue: "./examples/pcb-v2-full/history-1y.json" }
        "400":
          description: Malformed `end` or unknown `res`.
          content:
            text/plain:
              schema: { type: string }
        "500": { $ref: "#/components/responses/AllocationFailed" }
    options:
      tags: [data]
      operationId: preflightHistory
      summary: CORS preflight
      responses:
        "204": { $ref: "#/components/responses/Preflight" }

  /:
    get:
      tags: [pages]
      operationId: getDashboard
      summary: Built-in dashboard (HTML + JavaScript, reads /api/data and /api/history)
      responses:
        "200": { $ref: "#/components/responses/Html" }
  /status:
    get:
      tags: [pages]
      operationId: getStatusPage
      summary: Status page (plain HTML, reloads every 30 s)
      responses:
        "200": { $ref: "#/components/responses/Html" }
  /chart:
    get:
      tags: [pages]
      operationId: getChartRedirect
      summary: Old dashboard address
      responses:
        "302":
          description: Redirect to `/`.
          headers:
            Location: { schema: { type: string, const: "/" } }
  /help:
    get:
      tags: [pages]
      operationId: getHelp
      summary: Built-in documentation (README + docs + changelog as one page, works offline)
      responses:
        "200": { $ref: "#/components/responses/Html" }
  /help.md:
    get:
      tags: [pages]
      operationId: getHelpMarkdown
      summary: Markdown source of /help
      responses:
        "200":
          description: Markdown.
          content:
            text/plain:
              schema: { type: string }

  /manifest.webmanifest:
    get:
      tags: [pages]
      operationId: getManifest
      summary: Web app manifest (home screen / installed app)
      description: Name = device name, icons, dashboard colours; URLs relative to the manifest (works behind a reverse proxy).
      responses:
        "200":
          description: Manifest.
          content:
            application/manifest+json:
              schema: { type: object }

  /sw.js:
    get:
      tags: [pages]
      operationId: getServiceWorker
      summary: Service worker (offline dashboard, registered only in a secure context)
      description: "`Service-Worker-Allowed: /`, `Cache-Control: no-cache`. Never caches settings, setup, log, OTA or POSTs."
      responses:
        "200":
          description: JavaScript.
          content:
            application/javascript:
              schema: { type: string }

  /icon-192.png:
    get:
      tags: [pages]
      operationId: getIcon192
      summary: App icon 192 px
      description: "`Cache-Control: public, max-age=604800`."
      responses:
        "200":
          description: PNG.
          content:
            image/png:
              schema: { type: string, format: binary }

  /icon-512.png:
    get:
      tags: [pages]
      operationId: getIcon512
      summary: App icon 512 px
      description: "`Cache-Control: public, max-age=604800`."
      responses:
        "200":
          description: PNG.
          content:
            image/png:
              schema: { type: string, format: binary }

  /icon-maskable-512.png:
    get:
      tags: [pages]
      operationId: getIconMaskable
      summary: Maskable app icon 512 px
      description: "`Cache-Control: public, max-age=604800`."
      responses:
        "200":
          description: PNG.
          content:
            image/png:
              schema: { type: string, format: binary }

  /apple-touch-icon.png:
    get:
      tags: [pages]
      operationId: getAppleTouchIcon
      summary: Apple touch icon 180 px (opaque)
      description: "`Cache-Control: public, max-age=604800`."
      responses:
        "200":
          description: PNG.
          content:
            image/png:
              schema: { type: string, format: binary }

  /apple-touch-icon-precomposed.png:
    get:
      tags: [pages]
      operationId: getAppleTouchIconPrecomposed
      summary: Same as /apple-touch-icon.png
      description: "`Cache-Control: public, max-age=604800`."
      responses:
        "200":
          description: PNG.
          content:
            image/png:
              schema: { type: string, format: binary }

  /favicon-32.png:
    get:
      tags: [pages]
      operationId: getFavicon32
      summary: Favicon 32 px
      description: "`Cache-Control: public, max-age=604800`."
      responses:
        "200":
          description: PNG.
          content:
            image/png:
              schema: { type: string, format: binary }

  /favicon.ico:
    get:
      tags: [pages]
      operationId: getFavicon
      summary: Favicon (the 32-px PNG, image/png)
      description: "`Cache-Control: public, max-age=604800`."
      responses:
        "200":
          description: PNG.
          content:
            image/png:
              schema: { type: string, format: binary }

  /setup:
    get:
      tags: [pages]
      operationId: getSetupWizard
      summary: Setup wizard (HTML), step 1-7
      description: >-
        First-run guide: language, wireless station (mark sensors), location, units, admin password, outputs, summary.
        Each step posts its fields to `POST /api/settings` with `wizard=1` (and `wstep`), which saves them with the
        normal validation and redirects to the next step; restart-requiring fields are applied by one restart at the end
        (`POST /setup/done`). The dashboard (`/`) redirects here once per browser session while the setup is not done.
        Open without login while no admin password is set and the setup is not done; otherwise Digest like the settings.
      parameters:
        - { name: step, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 7, default: 1 }, description: Wizard step. }
      security: [{ digest: [] }, {}]
      responses:
        "200": { $ref: "#/components/responses/Html" }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/NoAdminPassword" }
  /setup/done:
    post:
      tags: [pages]
      operationId: finishSetupWizard
      summary: End the setup wizard (same-origin only)
      description: >-
        `action=finish` or `action=dismiss` ("Later"): sets the setup-done flag (parameter 58) so the dashboard no
        longer opens the wizard. `finish` restarts the node once if a step saved a restart-requiring setting.
      parameters:
        - { name: action, in: query, required: true, schema: { type: string, enum: [finish, dismiss] }, description: How the wizard ends. }
      security: [{ digest: [] }, {}]
      responses:
        "200": { $ref: "#/components/responses/Html" }
        "303": { description: "Redirect to the dashboard." }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { description: "No admin password configured after the setup, or a cross-site request." }

  /api/settings:
    get:
      tags: [admin]
      operationId: getSettings
      summary: Settings form (HTML)
      security: [{ digest: [] }]
      parameters:
        - name: saved
          in: query
          required: false
          description: Present after a successful save (shows "Saved.").
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Html" }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/NoAdminPassword" }
        "503": { $ref: "#/components/responses/LowMemory" }
    post:
      tags: [admin]
      operationId: postSettings
      summary: Save settings
      description: |
        Form fields as on the settings page (names in docs/settings.md); only
        fields present in the request change, others keep their value. The
        field `form` must be present. Same-origin only: a request carrying an
        `Origin` or `Referer` whose host differs from `Host` is refused (403);
        requests with neither header (curl, scripts) are accepted.
        `wifien=0` / `webapien=0` (Wi-Fi / web interface off, applied by a
        restart) are only accepted with `radiooffok=1` and while LoRaWAN is
        enabled and joined; otherwise they are rejected and stay on.
      security: [{ digest: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [form]
              properties:
                form: { type: string, description: "Marker of a complete form submission (any value)." }
              additionalProperties: { type: string }
      responses:
        "200":
          description: Saved; the node restarts or switches Wi-Fi (HTML notice page).
          content:
            text/html:
              schema: { type: string }
        "303":
          description: Saved without restart; redirect to `/api/settings?saved=1`.
          headers:
            Location: { schema: { type: string, const: "/api/settings?saved=1" } }
        "400":
          description: Incomplete form (no `form` field) or some values rejected (HTML page names them; the rest was saved).
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403":
          description: No admin password configured, or a cross-site request.
          content:
            text/plain:
              schema: { type: string }
        "503": { $ref: "#/components/responses/LowMemory" }

  /api/alarms/save:
    post:
      tags: [admin]
      operationId: postAlarms
      summary: Save the Alarms tab
      description: |
        Form fields of the settings page's Alarms tab (`a<n>_<field>` per rule,
        channel fields; docs/alarms.md). Only fields present change. Same-origin.
      security: [{ digest: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: { type: string } }
      responses:
        "303": { description: "Saved; redirect to `/api/settings?saved=1#alarms`." }
        "400": { description: "Some values rejected (HTML page names them; the rest was saved).", content: { text/html: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { description: "No admin password configured, or a cross-site request.", content: { text/plain: { schema: { type: string } } } }

  /api/alarms/test:
    post:
      tags: [admin]
      operationId: postAlarmTest
      summary: Save the Alarms tab and send a test notification
      description: |
        Like `/api/alarms/save`, then queues one test message for the channel
        `testch` (0 ntfy, 1 Pushover, 2 Telegram, 3 MQTT, 4 webhook); the
        result appears on the status page. Same-origin.
      security: [{ digest: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [testch]
              properties:
                testch: { type: string, description: "Channel number 0-4." }
              additionalProperties: { type: string }
      responses:
        "303": { description: "Queued; redirect to `/api/settings?test=1#alarms`." }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { description: "No admin password configured, or a cross-site request.", content: { text/plain: { schema: { type: string } } } }

  /api/settings/reset:
    post:
      tags: [admin]
      operationId: postSettingsReset
      summary: Reset records, rain / sunshine statistics, the AUX pulse total, or delete the chart history
      description: |
        The buttons under Settings -> System -> *Records and chart history*.
        `records` resets today ... this year, `recordsall` also the
        all-time records (like parameter 64), `history` deletes both chart
        ranges (24 h and 7 days) in RAM and flash, `rain` sets the rain
        statistics (today ... year, last rain, rain since start) to 0,
        `sunshine` the sunshine duration (today, yesterday), `aux` the AUX
        pulse total (V4 Full, like the downlink command). Done within one
        measurement cycle; redirects back to the settings page.
      security: [{ digest: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [what]
              properties:
                what: { type: string, enum: [records, recordsall, history, rain, sunshine, aux] }
      responses:
        "303": { description: Done; back to /api/settings#system. }
        "400": { description: Unknown `what`. }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/NoAdminPassword" }
  /api/diag/crash:
    post:
      tags: [admin]
      operationId: postCrashTest
      summary: Deliberate crash, to test the crash report
      description: |
        Settings -> System -> *Diagnostics* -> *Test crash*. `kind=panic`
        writes to address 0 in the main loop (a CPU exception), `watchdog`
        stops the main loop so the task watchdog resets the node after
        120 s. Starts about 1 s after the answer. Afterwards the status page
        and `/api/info` (`system.resets`, `system.lastCrash`) show it.
        Needs the typed word `confirm=CRASH` and a same-origin request
        besides the login - never triggered by a stray click.
      security: [{ digest: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [confirm]
              properties:
                kind: { type: string, enum: [panic, watchdog], default: panic }
                confirm: { type: string, enum: [CRASH] }
      responses:
        "200": { description: Started; the node restarts in a moment. }
        "400": { description: "`confirm` is not CRASH: nothing happens." }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/NoAdminPassword" }
  /api/system/reset:
    post:
      tags: [admin]
      operationId: postSystemReset
      summary: Reset settings, or erase everything
      description: |
        Settings -> System -> *Reset* ([settings.md](../settings.md#reset)).
        `what=settings` (typed word `confirm=RESET`): every setting back to
        its default except network access (Wi-Fi, static IP, device name,
        own access point), admin password, language and LoRaWAN keys; the
        measurement data, the reset history and the core dump stay - the
        node stays reachable. `what=everything` (`confirm=ERASE`): erases all
        settings incl. Wi-Fi credentials and every token, the measurement
        data, the chart history, the reset history, the core dump and the
        LoRaWAN session; the node then starts like a new one with the setup
        portal. Done about 1 s after the answer, ends in a restart.
        Same-origin request and login required.
      security: [{ digest: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [what, confirm]
              properties:
                what: { type: string, enum: [settings, everything] }
                confirm: { type: string, enum: [RESET, ERASE], description: "RESET for settings, ERASE for everything" }
      responses:
        "200": { description: Started; the node restarts in a moment. }
        "400": { description: "`confirm` does not match `what`: nothing happens." }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/NoAdminPassword" }
  /api/diag/coredump:
    get:
      tags: [admin]
      operationId: getCoreDump
      summary: Core dump of the last crash (raw flash image)
      description: |
        The ESP-IDF core dump the last crash left in the `coredump`
        partition, as stored (header + ELF + checksum). It holds the RAM
        contents at the crash - credentials too: admin only, do not share
        publicly. Decode with the `firmware.elf` of exactly that build
        (`system.lastCrash.elfSha`):
        `esp-coredump info_corefile --core-format raw -c uwn-coredump-....bin firmware.elf`.
      security: [{ digest: [] }]
      responses:
        "200":
          description: The dump.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/NoAdminPassword" }
        "404": { description: No (valid) core dump in flash. }
  /api/https/certificate:
    get:
      tags: [pages]
      operationId: getHttpsCertificate
      summary: The generated HTTPS certificate (PEM)
      description: |
        The self-signed certificate HTTPS runs with when the node generated
        it (docs/settings.md#https) - to trust it once on a PC or phone.
        Public like the TLS handshake that sends it anyway; never the
        private key. `404` while HTTPS is off or runs with the admin's
        uploaded certificate.
      responses:
        "200":
          description: The certificate (`<hostname>.crt`).
          content:
            application/x-x509-ca-cert:
              schema: { type: string }
        "404": { description: HTTPS does not run with a generated certificate. }
  /api/https/regenerate:
    post:
      tags: [admin]
      operationId: regenerateHttpsCertificate
      summary: Generate a new self-signed HTTPS certificate
      description: |
        Deletes the generated certificate and restarts the web server about
        1 s after the answer; the start generates a new one for the current
        device name and station address (needed after a change of either).
        The uploaded certificate, if usable, is still preferred. Same-origin
        request and login required.
      security: [{ digest: [] }]
      responses:
        "200": { $ref: "#/components/responses/Html" }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/NoAdminPassword" }
        "409": { description: HTTPS is not enabled. }
  /api/settings/rfsensors:
    get:
      tags: [admin]
      operationId: getSettingsRfSensors
      summary: Wireless sensor table of the settings page (HTML fragment)
      description: |
        The *Wireless sensors* section of the settings page alone (state,
        ID, name field, type, signal, values). The settings page loads it
        every 5 s to append newly received sensors and refresh signal and
        values without touching fields being edited.
      security: [{ digest: [] }]
      responses:
        "200": { $ref: "#/components/responses/Html" }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/NoAdminPassword" }
  /api/settings/backup:
    get:
      tags: [admin]
      operationId: getSettingsBackup
      summary: Download all settings as JSON
      description: |
        Every field of the settings page (`settings`: form name -> value as
        the form sends it), plus `format` ("uwn-settings"), `version` (1),
        `firmware`, `host`, `date`, `secrets`. Passwords and keys (Wi-Fi,
        admin, MQTT, weather networks, LoRaWAN AppKey) only with
        `secrets=1`. Sent as `uwn-settings-<host>-<date>.json`. Same-origin.
      security: [{ digest: [] }]
      parameters:
        - name: secrets
          in: query
          required: false
          description: "1 = include passwords and keys (plain text)."
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: The backup file (Content-Disposition attachment).
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403":
          description: No admin password configured, or a cross-site request.
          content:
            text/plain:
              schema: { type: string }

  /api/display/preview:
    post:
      tags: [admin]
      operationId: postDisplayPreview
      summary: Preview a custom OLED screen
      description: |
        Draws a custom screen of the built-in display from the posted
        (possibly unsaved) fields with the current values, off-screen - the
        preview on the settings page (Display tab). Form fields: `m` layout
        (0 = title + 5 small lines, 1 = title + large value + 2 lines), `t`
        title, `l0`-`l4` lines (placeholder templates, docs/settings.md).
        Answer: 2048 hex digits, the 1024 bytes of the 128 x 64 SSD1306
        buffer (byte x + 128 * page, bit n = row 8 * page + n). Same-origin.
      security: [{ digest: [] }]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                m: { type: string, enum: ["0", "1"] }
                t: { type: string, maxLength: 23 }
                l0: { type: string, maxLength: 39 }
                l1: { type: string, maxLength: 39 }
                l2: { type: string, maxLength: 39 }
                l3: { type: string, maxLength: 39 }
                l4: { type: string, maxLength: 39 }
      responses:
        "200":
          description: The display buffer as 2048 lowercase hex digits.
          content:
            text/plain:
              schema: { type: string, pattern: "^[0-9a-f]{2048}$" }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403":
          description: No admin password configured, or a cross-site request.
          content:
            text/plain:
              schema: { type: string }
        "503":
          description: Not enough memory for the canvas right now.
          content:
            text/plain:
              schema: { type: string }

  /api/display/saver:
    post:
      tags: [admin]
      operationId: postDisplaySaver
      summary: Preview a frame of the OLED screensaver
      description: |
        One frame of a screensaver takeover (docs/settings.md, Display) with the
        current values, off-screen - the preview button on the settings page.
        Form fields: `m` mode (1 blank, 2 dot, 3 walking figure, 4 weather icons),
        `seed` (same seed = same scene), `dur` duration in s (3-30), `t` ms into
        the takeover. Answer as for /api/display/preview. Same-origin.
      security: [{ digest: [] }]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                m: { type: string, enum: ["1", "2", "3", "4"] }
                seed: { type: string }
                dur: { type: string }
                t: { type: string }
      responses:
        "200":
          description: The display buffer as 2048 lowercase hex digits.
          content:
            text/plain:
              schema: { type: string, pattern: "^[0-9a-f]{2048}$" }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403":
          description: No admin password configured, or a cross-site request.
          content:
            text/plain:
              schema: { type: string }
        "503":
          description: Not enough memory right now.
          content:
            text/plain:
              schema: { type: string }

  /api/placeholders:
    get:
      tags: [admin]
      operationId: getPlaceholders
      summary: Placeholders that have a value now
      description: |
        For the settings page's "Available placeholders" lists. `for=display`:
        as on a custom OLED screen (device units, plus `clock`, `date`, `ip`
        and the unit labels `u_*`); `upload` / `alarm`: as in the custom
        uploads and alarm texts (metric). Only names with a value right now;
        wireless sensors as `rf<ID>_<field>` (8-digit ID) with `s` = the sensor's name, or
        model and ID. `alarm` adds `event`: the names filled in at the time
        of an alarm.
      security: [{ digest: [] }]
      parameters:
        - name: for
          in: query
          required: false
          schema: { type: string, enum: [display, upload, alarm] }
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [n, v]
                      properties:
                        n: { type: string, description: "name without braces" }
                        v: { type: string, description: "current value as the placeholder renders it, without unit" }
                        u: { type: string, description: "unit, if any" }
                        s: { type: string, description: "wireless sensor (name, or model and ID)" }
                  event:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/NoAdminPassword" }

  /api/settings/restore:
    post:
      tags: [admin]
      operationId: postSettingsRestore
      summary: Restore settings from a backup
      description: |
        Field `backup`: the backup file's text. Refused (400, nothing
        changed) if it is not a settings backup or from a newer major
        version. Fields this node's settings page does not have are ignored;
        the rest goes through `POST /api/settings` (same checks, restart if a
        restart field changed). The changes are listed on the next settings
        page. LoRaWAN session / DevNonces are not part of a backup.
        Same-origin.
      security: [{ digest: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [backup]
              properties:
                backup: { type: string, description: "The backup JSON." }
      responses:
        "200":
          description: Restored; the node restarts or switches Wi-Fi (HTML notice page).
          content:
            text/html:
              schema: { type: string }
        "303":
          description: Restored without restart; redirect to `/api/settings?saved=1`.
        "400":
          description: Not a valid backup / newer version (nothing changed), or some values rejected.
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403":
          description: No admin password configured, or a cross-site request.
          content:
            text/plain:
              schema: { type: string }

  /api/ota:
    post:
      tags: [admin]
      operationId: postFirmwareUpload
      summary: Firmware update (upload a firmware image)
      description: |
        Multipart field `firmware`: `universal-weather-node-<version>.bin`,
        or (from 2.0.0-rc.1 on) the `-factory.bin`, of which only the
        application part is written. Other files, a factory image with a
        different partition table, or too little free memory are refused
        before anything is written. Streamed to the inactive OTA partition;
        on success the node restarts about 1 s after the answer (rain
        statistics and records are saved first). Only with an admin password
        (Digest) and same-origin; without one, use the config portal.
        `?js=1` (the settings page's progress-bar upload): plain-text answer,
        otherwise an HTML result page. Behind a reverse proxy, allow request
        bodies of at least ~2.5 MB.
      security: [{ digest: [] }]
      parameters:
        - name: js
          in: query
          required: false
          schema: { type: string }
          description: Present = plain-text answer instead of an HTML page.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [firmware]
              properties:
                firmware: { type: string, format: binary, description: "The firmware image." }
      responses:
        "200":
          description: Written and verified; the node restarts.
          content:
            text/html:
              schema: { type: string }
            text/plain:
              schema: { type: string }
        "400":
          description: Refused (not a matching firmware image, low memory, no file) or the update failed; nothing is activated.
          content:
            text/html:
              schema: { type: string }
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403":
          description: No admin password configured (hint to set one or use the config portal), or a cross-site request.
          content:
            text/html:
              schema: { type: string }
            text/plain:
              schema: { type: string }

  /api/log:
    get:
      tags: [admin]
      operationId: getLogPage
      summary: Live log viewer (HTML)
      security: [{ digest: [] }]
      responses:
        "200": { $ref: "#/components/responses/Html" }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/NoAdminPassword" }
  /api/log/raw:
    get:
      tags: [admin]
      operationId: getLogRaw
      summary: Log buffer as plain text (last ~8 KB)
      security: [{ digest: [] }]
      responses:
        "200":
          description: Log text.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/NoAdminPassword" }
  /api/davis/log:
    get:
      tags: [admin]
      operationId: getDavisCapture
      summary: Davis sniffer capture = the radio trace as plain text (inline)
      description: >-
        Kept for compatibility: the Davis sniffer lines now go into the radio trace (Davis mode starts an
        open-ended trace unless one is running). Returns the same text as `GET /api/rf/trace`, without the
        download header. Experimental, the line format may change.
      security: [{ digest: [] }]
      responses:
        "200":
          description: The diagnostic file (header only, with a hint, if no capture is in memory).
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/NoAdminPassword" }
  /api/rf/trace:
    get:
      tags: [admin]
      operationId: getRadioTrace
      summary: Radio trace — download the diagnostic file, or its progress with ?status
      description: >-
        Without parameters: the diagnostic text file `uwn-rftrace-<hostname>-<YYYYMMDD-HHMM>.txt`
        (`Content-Disposition: attachment`; `…-up<seconds>s.txt` without a synced clock), streamed in chunks.
        Header: firmware, board, receive settings, ID list, sensor table, statistics per phase and per ID —
        never Wi-Fi, MQTT, admin, LoRaWAN or weather-network credentials. Then one line per recorded packet:
        uptime, local time (clock synced), phase (BRESSER, IT+17, IT+9, FSK17, DAVIS), RSSI, result (OK,
        IGNORED, FAILED, UNKNOWN, EVENT), protocol, model, ID, check, decoded values, byte count and hex bytes.
        The file contains the IDs and values of all sensors in range, including neighbours'.
        With `?status`: progress as JSON. Not CORS-enabled.
      security: [{ digest: [] }]
      parameters:
        - name: status
          in: query
          required: false
          description: Present = return the progress JSON instead of the file.
          schema: { type: string }
      responses:
        "200":
          description: The diagnostic file, or (with ?status) the progress.
          content:
            text/plain:
              schema: { type: string }
            application/json:
              schema: { $ref: "#/components/schemas/RadioTraceStatus" }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/NoAdminPassword" }
    post:
      tags: [admin]
      operationId: controlRadioTrace
      summary: Start, stop or discard a radio trace (same-origin only)
      description: >-
        Form or query parameters. `action=start` with `minutes` (1–120; the status page offers 5, 15, 60),
        `filter` (`all`, `problems` = only frames that failed a check or match no known format, `id` = only the
        sensor `id`, 8 hex digits). Allocates about 26 KB only while a capture is in memory; refused when the free
        heap is too low. A new start discards the previous capture. `action=stop` ends it (kept for download),
        `action=clear` frees the memory. With `redirect=1` (the status page form) the answer is a 303 to
        `/status#rftrace`, otherwise the progress JSON (409 when the action failed, with `error`).
      security: [{ digest: [] }]
      parameters:
        - { name: action, in: query, required: true, schema: { type: string, enum: [start, stop, clear] }, description: What to do. }
        - { name: minutes, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 120, default: 15 }, description: Capture duration (start). }
        - { name: filter, in: query, required: false, schema: { type: string, enum: [all, problems, id], default: all }, description: Which packets to record (start). }
        - { name: id, in: query, required: false, schema: { type: string, pattern: "^[0-9A-Fa-f]{1,8}$" }, description: Sensor ID for filter=id. }
        - { name: redirect, in: query, required: false, schema: { type: string }, description: Present = answer with a redirect to the status page. }
      responses:
        "200":
          description: Done; the progress afterwards.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioTraceStatus" }
        "303": { description: "Redirect to /status#rftrace (redirect=1)." }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { description: "No admin password configured, or a cross-site request." }
        "409":
          description: Not done (e.g. not enough free memory, wireless sensors off, invalid parameters).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioTraceStatus" }
  /api/rf/sensor:
    post:
      tags: [admin]
      operationId: setWirelessSensorState
      summary: Mark a wireless sensor Mine / Received / Hidden or move it in the Mine order (same-origin only)
      description: >-
        Form or query parameters `id` (sensor ID, hex) and `action`: `mine` (append to the "Mine" list: numbered
        first, Home Assistant device), `received` (remove from both lists), `hide` (hidden list: never stored,
        numbered or output), `up` / `down` (move within the "Mine" list = change its number). Saved at once.
        With `redirect=1` (status page buttons) the answer is a 303 to `/status`.
      security: [{ digest: [] }]
      parameters:
        - { name: id, in: query, required: true, schema: { type: string, pattern: "^[0-9A-Fa-f]{1,8}$" }, description: Sensor ID. }
        - { name: action, in: query, required: true, schema: { type: string, enum: [mine, received, hide, up, down] }, description: What to do. }
        - { name: redirect, in: query, required: false, schema: { type: string }, description: Present = redirect to the status page. }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [ok, state]
                properties:
                  ok: { type: boolean, description: "true." }
                  state: { type: string, enum: [mine, received, hidden], description: "The sensor's state now." }
        "303": { description: "Redirect to /status (redirect=1)." }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { description: "No admin password configured, or a cross-site request." }
        "409": { description: "Not done: unknown action, invalid ID, a list full (32 IDs), or no move possible." }
  /api/log/clear:
    post:
      tags: [admin]
      operationId: clearLog
      summary: Clear the log buffer (same-origin only)
      security: [{ digest: [] }]
      responses:
        "200":
          description: Cleared.
          content:
            text/plain:
              schema: { type: string, const: cleared }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403":
          description: No admin password configured, or a cross-site request.
          content:
            text/plain:
              schema: { type: string }

  /decoder:
    get:
      tags: [pages]
      operationId: getDecoder
      summary: Payload decoder for ChirpStack / TTN (JavaScript download)
      description: >-
        The decoder matching this firmware (`chirpstack/decoder.js`, embedded at build time) as an attachment
        `weather-node-decoder.js` — the same file as the config portal's `/decoder`. No login (no secrets in it).
      responses:
        "200":
          description: JavaScript source (`Content-Disposition: attachment`).
          content:
            application/javascript:
              schema: { type: string }
  /calibrate:
    get:
      tags: [admin]
      operationId: getCalibratePage
      summary: Guided wind-direction calibration (HTML)
      description: >-
        The config portal's calibration page: rotate the vane through 8 or 16 positions, each one captured from
        `GET /calibrate/sample`, then saved with `POST /calibrate/save`. Only on a board with a wind-vane input
        (404 on the Heltec V4 wireless build).
      security: [{ digest: [] }]
      responses:
        "200": { $ref: "#/components/responses/Html" }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/NoAdminPassword" }
        "404": { description: "No wind-vane input on this board." }
  /calibrate/sample:
    get:
      tags: [admin]
      operationId: getCalibrateSample
      summary: Live wind-vane ADC reading
      security: [{ digest: [] }]
      responses:
        "200":
          description: The averaged raw ADC value of the vane input.
          content:
            application/json:
              schema:
                type: object
                required: [adc]
                properties:
                  adc: { type: integer, minimum: 0, maximum: 4095, description: "Raw 12-bit ADC reading." }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { $ref: "#/components/responses/NoAdminPassword" }
        "404": { description: "No wind-vane input on this board." }
  /calibrate/save:
    post:
      tags: [admin]
      operationId: saveCalibration
      summary: Store the wind-direction calibration table (same-origin only)
      description: >-
        Stores up to 16 positions (more are ignored), applies them immediately and switches the wind-direction
        sensor type to the calibrated table (setting `winddirtyp` = 1).
      security: [{ digest: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positions]
              properties:
                positions:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [deg, adc]
                    properties:
                      deg: { type: integer, description: "Direction in degrees (taken modulo 360)." }
                      adc: { type: integer, minimum: 0, maximum: 4095, description: "ADC reading at that direction (clamped)." }
      responses:
        "200":
          description: Saved (localised confirmation text).
          content:
            text/plain:
              schema: { type: string }
        "400": { description: "Invalid JSON or no positions." }
        "401": { $ref: "#/components/responses/DigestChallenge" }
        "403": { description: "No admin password configured, or a cross-site request." }
        "404": { description: "No wind-vane input on this board." }

components:
  securitySchemes:
    digest:
      type: http
      scheme: digest
      description: HTTP Digest, user `admin`, realm "WeatherNode settings". Disabled (403) while no admin password is set.
  headers:
    AllowOrigin:
      description: Any origin may read this read-only resource.
      schema: { type: string, const: "*" }
    NoStore:
      description: Live data — do not cache.
      schema: { type: string, const: no-store }
  responses:
    Html:
      description: HTML page.
      content:
        text/html:
          schema: { type: string }
    AllocationFailed:
      description: The JSON document could not be allocated (low memory) — retry later.
      headers:
        Access-Control-Allow-Origin: { $ref: "#/components/headers/AllowOrigin" }
      content:
        text/plain:
          schema: { type: string }
    DigestChallenge:
      description: Authentication required (WWW-Authenticate Digest challenge).
      headers:
        WWW-Authenticate: { schema: { type: string } }
    NoAdminPassword:
      description: No admin password configured — the page is disabled.
      content:
        text/plain:
          schema: { type: string }
    LowMemory:
      description: Not enough free memory to render the page right now — retry.
      content:
        text/plain:
          schema: { type: string }
    Preflight:
      description: CORS preflight accepted (only needed when a client adds request headers).
      headers:
        Access-Control-Allow-Origin: { $ref: "#/components/headers/AllowOrigin" }
        Access-Control-Allow-Methods: { schema: { type: string, const: "GET, OPTIONS" } }
        Access-Control-Allow-Headers: { schema: { type: string, const: "*" } }
        Access-Control-Allow-Private-Network: { schema: { type: string, const: "true" } }
        Access-Control-Max-Age: { schema: { type: string, const: "86400" } }
  schemas:
    RadioTraceStatus:
      type: object
      description: Progress of the radio trace (GET /api/rf/trace?status, answer of POST).
      required: [ok, allocated, running, filter, autoStarted, durationSec, elapsedSec, leftSec, packets, lines, bufferBytes, bufferSize, overwrittenBytes]
      properties:
        ok: { type: boolean, description: "The requested action succeeded (always true for GET)." }
        error: { type: string, description: "Why the action failed (409)." }
        allocated: { type: boolean, description: "A capture (running or finished) is in memory and can be downloaded." }
        running: { type: boolean, description: "Recording now." }
        filter: { type: string, enum: [all, problems, id], description: "Which packets are recorded." }
        id: { type: string, pattern: "^[0-9A-F]{8}$", description: "Sensor ID of filter id." }
        autoStarted: { type: boolean, description: "Started by the Davis mode (open-ended)." }
        durationSec: { type: integer, minimum: 0, description: "Planned duration; 0 = until stopped." }
        elapsedSec: { type: integer, minimum: 0, description: "Recording time so far (or in total once finished)." }
        leftSec: { type: integer, minimum: 0, description: "Time left while running with a duration." }
        packets: { type: integer, minimum: 0, description: "Frames received during the capture (before the filter)." }
        lines: { type: integer, minimum: 0, description: "Lines recorded." }
        bufferBytes: { type: integer, minimum: 0, description: "Bytes in the ring buffer." }
        bufferSize: { type: integer, description: "Ring buffer size (24576)." }
        overwrittenBytes: { type: integer, minimum: 0, description: "Oldest bytes overwritten because the ring was full." }
        stopReason: { type: string, description: "Why a finished capture ended (time is up, stopped by the user, Davis mode left)." }
