; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; main = the next major version, Heltec WiFi LoRa 32 V4 only (ESP32-S3R2:
; 16 MB flash, 2 MB quad PSRAM). The 2.x line (V3 and V4, Arduino-ESP32
; 2.0.17) lives on branch 2.x.

[env:heltec_wifi_lora_32_V4]
; pioarduino: Arduino-ESP32 3.3.13 on ESP-IDF 5.5 (the official
; platformio/espressif32 platform stays on Arduino 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
; the V4 is pin-compatible with the V3 (same board definition), but has
; 16 MB flash and a quad-SPI PSRAM in the package (ESP32-S3R2)
board = heltec_wifi_lora_32_V3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 6291456
board_build.arduino.memory_type = qio_qspi
framework = arduino
monitor_speed = 115200
; 16-MB layout, frozen for 4.0.0 (docs/design/storage-layout.md): two 6-MB
; app slots, cfgdata (settings, 128 KB), coredump (128 KB), a 1.5-MB "history"
; partition and 2.2 MB reserved ("files"). Not OTA-compatible with the 3.x
; table: the first installation is a USB flash of the -factory image.
board_build.partitions = partitions.csv
; Own sdkconfig on top of the Arduino defaults (pioarduino rebuilds the
; framework libraries once, cached afterwards):
; - esp_http_server: request headers up to 2048 B (default 1024 - a Chrome
;   request with a Digest login is ~990 B already), URIs up to 1024 B
; - mbedTLS buffers in the PSRAM instead of forced internal RAM (TLS needs
;   40-50 KB per connection: weather networks, notifications, HTTPS server)
; - 20 sockets instead of 16: with HTTPS on, two web servers (plain 3 + 3 own,
;   HTTPS 5 + 3 own) next to MQTT, uploads, Loxone UDP and the captive DNS
; - the PSRAM settings of the Arduino libraries, spelt out: without
;   CONFIG_SPIRAM=y here pioarduino builds the libraries WITHOUT PSRAM
;   (the board definition is the V3's)
; (The core dump to flash in ELF format, which the crash report reads, is
; on in the Arduino defaults; src/reset_history_esp.cpp refuses to build
; without it.)
; Lines starting with '#' would be ini comments: "=n" switches an option off.
custom_sdkconfig =
    CONFIG_SPIRAM=y
    CONFIG_SPIRAM_MODE_QUAD=y
    CONFIG_SPIRAM_TYPE_AUTO=y
    CONFIG_SPIRAM_SPEED_80M=y
    CONFIG_SPIRAM_USE_MALLOC=y
    CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
    CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=0
    CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY=y
    CONFIG_HTTPD_MAX_REQ_HDR_LEN=2048
    CONFIG_HTTPD_MAX_URI_LEN=1024
    CONFIG_LWIP_MAX_SOCKETS=20
    CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=n
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
extra_scripts =
    pre:tools/version.py
build_flags =
    -D MQTT_MAX_PACKET_SIZE=1024
    ; the PSRAM is part of the V4 (S3R2): started by the core, malloc() of
    ; 4 KB and more prefers it (src/psram.h)
    -D BOARD_HAS_PSRAM
lib_deps =
	jgromes/RadioLib@^7.6.0
	ropg/Heltec_ESP32_LoRa_v3@^0.9.2
	electroniccats/CayenneLPP@^1.6.1
	ropg/LoRaWAN_ESP32@^1.2.0
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    adafruit/Adafruit BusIO @ ^1.16.1
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^4.0.6
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.2.0
    knolleary/PubSubClient @ ^2.8
